<header>
  <mat-toolbar color="primary"
    class="w-full flex! flex-col! lg:flex-row! justify-between! h-full! lg:h-[170px]! gap-3 px-4! py-6!">
    <div class="flex flex-row w-full">
      <app-logo-name class="w-full! flex! justify-start! items-center! lg:w-auto"></app-logo-name>
      <!-- Unique navigation -->
      <nav
        class="navigation flex flex-col items-center justify-center gap-3 fixed lg:static w-full h-screen lg:h-auto z-1000 lg:z-0 opacity-0 lg:opacity-100 transition-opacity duration-300 invisible lg:visible"
        [class.mobile-open]="isMenuOpen" role="navigation" aria-label="Navigation principale">
        <!-- Mobile close button -->
        <app-button-outlined [class]="'mobile-close-button'" icon="close" ariaLabel="Fermer le menu"
          (clicked)="closeMenu()"></app-button-outlined>
        <ul class="navigation-list flex flex-col lg:flex-row gap-6 lg:gap-0 w-full lg:w-auto">
          <li class="navigation-item">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
              class="navigation-link" (click)="closeMenu()" aria-label="Accueil">Accueil</a>
          </li>
          <li class="navigation-item">
            <a routerLink="/projets" routerLinkActive="active" class="navigation-link" (click)="closeMenu()"
              aria-label="Projets">Projets</a>
          </li>
          <li class="navigation-item">
            <a routerLink="/expertises" routerLinkActive="active" class="navigation-link" (click)="closeMenu()"
              aria-label="Expertises">Expertises</a>
          </li>
          <li class="navigation-item">
            <a routerLink="/contact" routerLinkActive="active" class="navigation-link" (click)="closeMenu()"
              aria-label="Contact">Contact</a>
          </li>
        </ul>
      </nav>
      <div class="flex items-center gap-2">
        <app-theme-toggle></app-theme-toggle>
        <app-social-link></app-social-link>
      </div>
    </div>
    <button mat-fab aria-label="Menu" class="md:hidden!" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen">
      <mat-icon>{{ isMenuOpen ? 'close' : 'menu' }}</mat-icon>
    </button>
  </mat-toolbar>

  <!-- Overlay for mobile only -->
  <div
    class="mobile-menu-overlay fixed top-0 left-0 w-full h-full bg-black/50 z-999 opacity-0 invisible transition-opacity duration-300"
    [class.open]="isMenuOpen" (click)="closeMenu()"></div>
</header>
